name: Build PR Docker Images

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build"
        required: true
        type: string

concurrency:
  group: docker-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve PR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      commit_sha: ${{ steps.pr.outputs.commit_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:
      - name: Resolve PR build target
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi

          echo "Resolving PR #${PR_NUMBER}"

          PR_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")

          PR_STATE=$(echo "${PR_JSON}" | jq -r '.state')
          PR_SHA=$(echo "${PR_JSON}" | jq -r '.head.sha')
          PR_BRANCH=$(echo "${PR_JSON}" | jq -r '.head.ref')
          PR_REPO=$(echo "${PR_JSON}" | jq -r '.head.repo.full_name')

          if [ "${PR_STATE}" != "open" ]; then
            echo "PR #${PR_NUMBER} is not open."
            exit 1
          fi

          if [[ ! "${PR_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid PR commit SHA: ${PR_SHA}"
            exit 1
          fi

          echo "PR repository: ${PR_REPO}"
          echo "PR branch: ${PR_BRANCH}"
          echo "PR SHA: ${PR_SHA}"

          echo "commit_sha=${PR_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and scan ${{ matrix.name }}
    needs:
      - prepare

    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: govtool-backend
            workdir: ./govtool/backend
            dockerfile: ./govtool/backend/Dockerfile
            image: ghcr.io/${{ github.repository }}-backend

          - name: govtool-frontend
            workdir: ./govtool/frontend
            dockerfile: ./govtool/frontend/Dockerfile
            image: ghcr.io/${{ github.repository }}-frontend

          - name: govtool-metadata-validation
            workdir: ./govtool/metadata-validation
            dockerfile: ./govtool/metadata-validation/Dockerfile
            image: ghcr.io/${{ github.repository }}-metadata-validation

    steps:
      # PR originates from a fork.
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.prepare.outputs.pr_number }}/head
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          set -euo pipefail

          ACTUAL_SHA=$(git rev-parse HEAD)

          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${ACTUAL_SHA}"

          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "The checked-out commit does not match the PR head."
            exit 1
          fi

      - name: Set image and tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          IMAGE=$(echo "${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ needs.prepare.outputs.commit_sha }}"
          PR_NUMBER="${{ needs.prepare.outputs.pr_number }}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_tag=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          echo "IMAGE=${IMAGE}"
          echo "SHA=${SHA}"
          echo "PR_TAG=pr-${PR_NUMBER}"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha }}
            type=raw,value=${{ steps.vars.outputs.pr_tag }}

      - name: Print generated Docker tags
        run: |
          echo "Generated Docker tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Lint Dockerfile
        id: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          failure-threshold: error
          format: json
          dockerfile: ${{ matrix.dockerfile }}

      - name: Save Hadolint output
        if: always()
        run: |
          cd "${{ matrix.workdir }}"
          echo "$HADOLINT_RESULTS" | jq '.' > hadolint_output.json || true

      - name: Run app lint
        run: |
          cd "${{ matrix.workdir }}"

          if [ -f lint.sh ]; then
            chmod +x lint.sh
            ./lint.sh
          else
            echo "No lint.sh found, skipping app lint"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache isolated by PR and service.
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.workdir }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pr-${{ needs.prepare.outputs.pr_number }}-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=pr-${{ needs.prepare.outputs.pr_number }}-${{ matrix.name }}

      - name: Scan Docker image with Dockle
        run: |
          wget -q \
            https://github.com/goodwithtech/dockle/releases/download/v0.4.14/dockle_0.4.14_Linux-64bit.tar.gz

          tar zxf dockle_0.4.14_Linux-64bit.tar.gz
          sudo mv dockle /usr/local/bin

          dockle \
            --exit-code 1 \
            --exit-level fatal \
            --format json \
            -ak GHC_RELEASE_KEY \
            -ak CABAL_INSTALL_RELEASE_KEY \
            -ak STACK_RELEASE_KEY \
            -ak KEY_SHA512 \
            --output "${{ matrix.workdir }}/dockle_scan_output.json" \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.pr_tag }}"

          cat "${{ matrix.workdir }}/dockle_scan_output.json"

      - name: Save scanned Docker image
        shell: bash
        run: |
          docker image save \
            --output "/tmp/${{ matrix.name }}.tar" \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}" \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.pr_tag }}"

      - name: Upload scanned Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish ${{ matrix.name }}
    needs:
      - prepare
      - build

    runs-on: ubuntu-latest

    # Only this job receives permission to publish packages.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: govtool-backend
            image: ghcr.io/${{ github.repository }}-backend

          - name: govtool-frontend
            image: ghcr.io/${{ github.repository }}-frontend

          - name: govtool-metadata-validation
            image: ghcr.io/${{ github.repository }}-metadata-validation

    steps:
      - name: Set image and tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          IMAGE=$(echo "${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ needs.prepare.outputs.commit_sha }}"
          PR_NUMBER="${{ needs.prepare.outputs.pr_number }}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_tag=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.name }}
          path: /tmp/docker-image

      - name: Load scanned Docker image
        run: |
          docker image load \
            --input "/tmp/docker-image/${{ matrix.name }}.tar"

      - name: Verify expected Docker tags
        run: |
          docker image inspect \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}"

          docker image inspect \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.pr_tag }}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push Docker images to GHCR
        run: |
          docker image push \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}"

          docker image push \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.pr_tag }}"